<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="5juxOzoLDzFpvNq4QfDFMkCKgM-DukdPU2GCIVuPT84" />

    <!-- Primary SEO -->
    <title>YatraSathi – AI Travel Planner for India | Plan Trips, Budget, Hotels & More</title>
    <meta name="description" content="YatraSathi is your AI-powered travel companion. Plan complete itineraries, estimate budgets, find hotels, discover local food, check safety guides, and explore interactive maps — all in one place." />
    <meta name="keywords" content="AI travel planner India, trip planner, budget estimator travel, hotel recommendations India, food guide India, travel safety guide, best time to visit India, interactive travel map, YatraSathi" />
    <meta name="author" content="YatraSathi" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://yatrasathi.in/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yatrasathi.in/" />
    <meta property="og:title" content="YatraSathi – AI Travel Planner for India" />
    <meta property="og:description" content="Plan smarter trips with AI. Get complete itineraries, budget breakdowns, hotel picks, food guides, safety reports and live weather — all powered by Groq AI." />
    <meta property="og:image" content="https://yatrasathi.in/og-image.png" />
    <meta property="og:site_name" content="YatraSathi" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://yatrasathi.in/" />
    <meta name="twitter:title" content="YatraSathi – AI Travel Planner for India" />
    <meta name="twitter:description" content="Plan smarter trips with AI. Itineraries, budgets, hotels, food, safety & more." />
    <meta name="twitter:image" content="https://yatrasathi.in/og-image.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "YatraSathi",
      "url": "https://yatrasathi.in",
      "description": "AI-powered travel planning platform for Indian and international destinations.",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Web",
      "offers": [
        { "@type": "Offer", "name": "Free Plan", "price": "0", "priceCurrency": "INR" },
        { "@type": "Offer", "name": "Basic Plan", "price": "199", "priceCurrency": "INR" },
        { "@type": "Offer", "name": "Pro Plan", "price": "499", "priceCurrency": "INR" }
      ],
      "creator": { "@type": "Organization", "name": "YatraSathi" }
    }
    </script>
    <title>YatraSathi – AI Travel Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      html,
      body,
      #root {
        height: 100%;
        font-family: "Inter", sans-serif;
        background-color: #f9f1ec;
        color: #1B2A3B;
      }
      /* Smooth scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(42, 157, 143, 0.35);
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(42, 157, 143, 0.55);
      }
      /* Global smooth transitions */
      a, button {
        transition: color 0.25s ease, background-color 0.25s ease, border-color 0.25s ease, opacity 0.25s ease;
      }
      /* Textarea global override */
      .textarea-override {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.45);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(0, 0, 0, 0.06);
        color: #1B2A3B;
        font-size: 0.92rem;
        font-family: "Inter", sans-serif;
        outline: none;
        resize: vertical;
        min-height: 80px;
        box-sizing: border-box;
        transition: border-color 0.25s ease;
      }
      .textarea-override:focus {
        border-color: rgba(42, 157, 143, 0.45);
      }
      /* AI hover card – only functional cards get hover */
      .ai-hover-card {
        background: rgba(255, 255, 255, 0.55) !important;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(0, 0, 0, 0.06) !important;
        border-radius: 18px;
        padding: 24px;
        transition: border-color 0.3s ease !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
